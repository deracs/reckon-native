name: macOS build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Check source privacy
        run: cargo reckon privacy
      - name: Check Rust and formatting
        run: cargo reckon check
      - name: Build app
        run: ./scripts/build-app.sh
      - name: Swift checks
        run: |
          swift run -Xswiftc -warnings-as-errors ReckonChecks
          swift run -Xswiftc -warnings-as-errors ReckonImageChecks
      - name: Backend and update-signature checks with synthetic data
        run: cargo reckon test
      - name: Verify, sign and package app
        env:
          SPARKLE_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && secrets.SPARKLE_PRIVATE_KEY || '' }}
        run: ./scripts/package-release.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Reckon-macOS-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release and signed update feeds
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: Reckon-macOS-*
          path: release
          merge-multiple: true
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Resolve pinned Sparkle signing tools
        run: swift package resolve
      - name: Create draft release with both Mac architectures
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/*.zip release/*.sha256 --draft --verify-tag --title "Reckon $RELEASE_TAG" --notes-file .github/release-notes.md
      - name: Sign feeds and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: cargo reckon publish-feeds "$RELEASE_TAG" --publish
